services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Vite >= 6.1 appends this to allowedHosts; set by the platform.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
